name: Legacy CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: legacy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    if: github.repository == 'x1nfinity/gitlab-mcp-legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLAB_DISABLE_VERSION_CHECK: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Test legacy compatibility and package identity
        run: |
          node --import tsx/esm --test --experimental-test-isolation=none --test-concurrency=1 \
            test/gitlab-11-response-schema.test.ts \
            test/merge-request-project-identity-schema.test.ts \
            test/test-gitlab-11-core.ts \
            test/server/version.test.ts \
            test/mcp-server-name.test.ts \
            test/utils/version-check.test.ts

      - name: Check runtime dependencies
        run: npm run check:runtime-deps
